<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veriff – Identitätsverifizierung</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #f0f4ff;
      --card:    #ffffff;
      --border:  #d1d9f0;
      --accent:  #1a56db;
      --text:    #0d1b2a;
      --muted:   #6b7280;
      --success: #16a34a;
      --radius:  16px;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 40px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 40px rgba(26,86,219,.10);
    }

    /* ── Veriff logo ── */
    .logo {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .logo em { color: #60a5fa; font-style: normal; }
    .tagline {
      font-size: .72rem;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    /* ── Divider ── */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin-bottom: 32px;
    }

    /* ── Checkbox row ── */
    .check-row {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #f8faff;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      cursor: pointer;
      user-select: none;
      transition: border-color .2s, box-shadow .2s;
      margin-bottom: 32px;
      position: relative;
    }
    .check-row:hover { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(26,86,219,.08); }
    .check-row.done  { border-color: var(--success); cursor: default; }
    .check-row.done:hover { box-shadow: none; }

    /* custom checkbox */
    .cb-box {
      width: 26px; height: 26px;
      flex-shrink: 0;
      border: 2px solid #9ca3af;
      border-radius: 6px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color .2s, background .2s;
    }
    .check-row.verifying .cb-box {
      border-color: var(--accent);
    }
    .check-row.done .cb-box {
      border-color: var(--success);
      background: var(--success);
    }
    .cb-spinner {
      display: none;
      width: 14px; height: 14px;
      border: 2px solid rgba(26,86,219,.25);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    .cb-check {
      display: none;
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      line-height: 1;
    }
    .check-row.verifying .cb-spinner { display: block; }
    .check-row.done .cb-check       { display: block; }

    .cb-label {
      font-size: .95rem;
      font-weight: 600;
      color: var(--text);
      flex: 1;
      text-align: left;
    }
    .cb-brand {
      font-size: .65rem;
      color: var(--muted);
      letter-spacing: .5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .cb-brand-logo {
      font-size: .75rem;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 1px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    .footer {
      margin-top: 8px;
      font-size: .68rem;
      color: #9ca3af;
    }
    .legal-links {
      margin-top: 12px;
      font-size: .72rem;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .legal-links a {
      color: #1a56db;
      text-decoration: none;
      font-weight: 700;
    }
    .legal-links a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="card">

  <!-- Veriff branding -->
  <div class="logo">Ver<em>iff</em></div>
  <div class="tagline">Identity Verification</div>

  <hr class="divider" />

  <!-- Checkbox verification row -->
  <div class="check-row" id="check-row" onclick="startVerification()">
    <div class="cb-box" id="cb-box">
      <div class="cb-spinner" id="cb-spinner"></div>
      <div class="cb-check" id="cb-check">&#10003;</div>
    </div>
    <span class="cb-label" id="cb-label">Ich bin kein Roboter</span>
    <div class="cb-brand">
      <span class="cb-brand-logo">Veriff</span>
      <span>Privacy &middot; Terms</span>
    </div>
  </div>

  <div class="footer">&#128274; Gesicherte Verbindung &middot; Daten werden nicht gespeichert</div>
  <div class="legal-links">
    <a href="datenschutz.html">Datenschutz</a>
    <a href="impressum.html">Impressum</a>
  </div>
</div>

<script>
  var params = new URLSearchParams(window.location.search);
  var origin = params.get('origin') || '';

  var verifying = false;

  function startVerification() {
    if (verifying) return;
    verifying = true;

    var row = document.getElementById('check-row');
    row.classList.add('verifying');

    /* Simulate a brief verification delay */
    setTimeout(function() {
      row.classList.remove('verifying');
      row.classList.add('done');
      document.getElementById('cb-label').textContent = 'Verifizierung erfolgreich';
      redirectBack();
    }, 1400);
  }

  function redirectBack() {
    if (!origin) {
      window.location.href = 'index.html?verified=1';
      return;
    }
    var base = decodeURIComponent(origin);
    var sep  = base.indexOf('?') !== -1 ? '&' : '?';
    window.location.href = base + sep + 'verified=1';
  }
</script>
</body>
</html>
